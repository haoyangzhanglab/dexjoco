model_verbosity = "low"
web_search = "live"

# Keep sandbox escalation available and route it through automatic review.
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# Paths are relative to this .codex directory.
writable_roots = ["../../dexmani_policy"]
network_access = false

[agents]
max_concurrent_threads_per_session = 2
